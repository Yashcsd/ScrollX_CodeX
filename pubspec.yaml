name: gamereel
description: A gamified scrollable mini-games app — like Instagram Reels for games.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Networking ──────────────────────────────────────────
  http: ^1.2.0

  # ── Local storage ───────────────────────────────────────
  shared_preferences: ^2.2.3

  # ── Animations ──────────────────────────────────────────
  flutter_animate: ^4.5.0

  # ── Fonts ───────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── State management ────────────────────────────────────
  provider: ^6.1.2

  # ── UUID generator ──────────────────────────────────────
  uuid: ^4.4.0

  # ── Firebase ────────────────────────────────────────────
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # 🔥 App icon generator
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # 📁 Assets
  assets:
    - assets/images/ScrollX_Logo.png

# 🔥 ICON CONFIG (VERY IMPORTANT)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ScrollX_Logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/ScrollX_Logo.png"
